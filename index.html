  <script>

];

    const weekdayMap = {
  '星期日': 0,
  '星期一': 1,
  '星期二': 2,
  '星期三': 3,
  '星期四': 4,
  '星期五': 5,
  '星期六': 6
};

    function countMonthlyClasses(year, month, classDays) {

  const targetWeekdays = classDays
    .map(day => weekdayMap[day])
    .filter(day => day !== undefined);

  if (targetWeekdays.length === 0) {
    return 0;
  }

  // 國定假日
  const nationalHolidays =
    String(year) === '2026'
      ? holidays2026
      : String(year) === '2027'
        ? holidays2027
        : [];

  // Notion 自訂停課日
  const customHolidays = holidaysData
    .filter(holiday => holiday.enabled)
    .map(holiday => holiday.date);

  // 合併國定假日＋自訂停課日
  const allHolidays = [
    ...nationalHolidays,
    ...customHolidays
  ];

  let count = 0;

  const daysInMonth =
    new Date(Number(year), Number(month), 0).getDate();

  for (let day = 1; day <= daysInMonth; day++) {

    const date = new Date(
      Number(year),
      Number(month) - 1,
      day
    );

    if (!targetWeekdays.includes(date.getDay())) {
      continue;
    }

    const dateString =
      `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

    if (allHolidays.includes(dateString)) {
      continue;
    }

    count++;
  }

  return count;
}
    
    let monthlyFeesData = [];
    let seasonFeesData = [];
    let studentsData = [];
    let feeSettingsData = [];
    let holidaysData = [];
    let selectedStudentGrade = '';
    let editingMonthlyId = '';
    
    async function loadData() {

      const loading = document.getElementById('loading');
      const dashboard = document.getElementById('dashboard');

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('API 連線失敗');
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || '資料讀取失敗');
        }

        monthlyFeesData = data.monthlyFees;
        seasonFeesData = data.seasonFees || [];
        studentsData = data.students;
        feeSettingsData = data.feeSettings;
        holidaysData = data.holidays || [];

        renderStudentOptions();
        
        document.getElementById('studentCount').textContent =
          data.students.length;

        document.getElementById('monthlyCount').textContent =
          data.monthlyFees.length;

renderMonthlyFees(monthlyFeesData);
renderSeasonFees(seasonFeesData);

        document.getElementById('seasonCount').textContent =
          data.seasonFees.length;

        document.getElementById('settingCount').textContent =
          data.feeSettings.length;

        loading.style.display = 'none';
        dashboard.style.display = 'block';

      } catch (error) {

        console.error(error);

        loading.classList.add('error');
        loading.innerHTML = '❌ 資料讀取失敗';

      }
    }

    function renderStudentOptions() {

  // 月收新增表單的學生選單
  const studentSelect =
    document.getElementById('monthlyStudent');

  studentSelect.innerHTML =
    '<option value="">請選擇學生</option>';

  // 季收管理的學生篩選選單
  const seasonStudentFilter =
    document.getElementById('seasonStudentFilter');

  seasonStudentFilter.innerHTML =
    '<option value="">全部學生</option>';

  studentsData.forEach(student => {

    // 月收選單
    const option = document.createElement('option');

    option.value = student.id;
    option.textContent =
      `${student.name}｜${student.grade || '未設定年級'}`;

    studentSelect.appendChild(option);

    // 季收篩選選單
    const seasonOption = document.createElement('option');

    seasonOption.value = student.id;
    seasonOption.textContent =
      `${student.name}｜${student.grade || '未設定年級'}`;

    seasonStudentFilter.appendChild(seasonOption);

  });

}
    
    function renderMonthlyFees(monthlyFees) {

  const monthlyList = document.getElementById('monthlyList');

  if (monthlyFees.length === 0) {
    monthlyList.innerHTML = '目前沒有符合條件的月收資料';
    return;
  }

  monthlyList.innerHTML = monthlyFees.map(item => {

    const student = studentsData.find(
      student => student.id === item.studentId
    );

    const studentName = student
      ? student.name
      : '未知學生';

    return `
      <div class="monthly-item">

        <div class="monthly-top">
          <span class="monthly-name">${studentName}</span>

          <span class="monthly-tag">
            ${item.grade || '未設定年級'}
          </span>

          <span class="monthly-tag">
            ${item.month || '未設定月份'}
          </span>
        </div>

        <div class="monthly-content">
          💰 ${item.content || '未設定收費內容'}
        </div>

        <div class="monthly-status">
          ${item.billed ? '✅ 已開單' : '⬜ 未開單'}
        </div>

<button
  type="button"
  class="edit-monthly-btn"
  data-id="${item.id}">
  ✏️ 編輯
</button>

<button
  type="button"
  class="delete-monthly-btn"
  data-id="${item.id}">
  🗑️ 刪除
</button>

      </div>
    `;

  }).join('');
}

    function renderSeasonFees(seasonFees) {

  const seasonList = document.getElementById('seasonList');

  if (seasonFees.length === 0) {
    seasonList.innerHTML = '目前沒有季收資料';
    return;
  }

  seasonList.innerHTML = seasonFees.map(item => {

    const student = studentsData.find(
      student => student.id === item.studentId
    );

    const studentName = student
      ? student.name
      : item.studentName || '未知學生';

    return `
      <div class="monthly-item">

        <div class="monthly-top">

          <span class="monthly-name">
            ${studentName}
          </span>

          <span class="monthly-tag">
            ${item.grade || '未設定年級'}
          </span>

          <span class="monthly-tag">
            ${item.period || '未設定期別'}
          </span>

        </div>

        <div class="monthly-content">
          📅 ${item.startDate || '未設定'} ～ ${item.endDate || '未設定'}
        </div>

        <div class="monthly-content">
          📚 ${item.totalLessons ?? '未設定'} 堂
        </div>

        <div class="monthly-status">
          ${item.billed ? '✅ 已開單' : '⬜ 未開單'}
        </div>

      </div>
    `;

  }).join('');
}

    function filterMonthlyFees() {

  const selectedMonth =
    document.getElementById('monthFilter').value;

  const selectedGrade =
    document.getElementById('gradeFilter').value;

  const filteredFees = monthlyFeesData.filter(item => {

    const matchMonth =
      !selectedMonth || item.month === selectedMonth;

    const matchGrade =
      !selectedGrade || item.grade === selectedGrade;

    return matchMonth && matchGrade;

  });

  renderMonthlyFees(filteredFees);
}

    function filterSeasonFees() {

  const selectedGrade =
    document.getElementById('seasonGradeFilter').value;

  const selectedStudent =
    document.getElementById('seasonStudentFilter').value;

  const filteredFees = seasonFeesData.filter(item => {

    const matchGrade =
      !selectedGrade || item.grade === selectedGrade;

    const matchStudent =
      !selectedStudent || item.studentId === selectedStudent;

    return matchGrade && matchStudent;

  });

  renderSeasonFees(filteredFees);
}

  document.getElementById('monthlyYear').value;

};

      });

const result = JSON.parse(responseText);

alert(editingMonthlyId ? '月收修改成功！' : '月收新增成功！');

document.getElementById('monthlyContent').value = '';

selectedStudentGrade = '';

document.getElementById('monthlyForm').style.display = 'none';

// 重新讀取最新資料
await loadData();

    } catch (error) {

    if (!button) {
      return;
    }

    const item = monthlyFeesData.find(

    );

      return;
    }

    const contentInput =

    document
  .getElementById('monthlyList')
  .addEventListener('click', async function (event) {

    const button = event.target.closest('.delete-monthly-btn');

    if (!button) {
      return;
    }

    const item = monthlyFeesData.find(
      fee => fee.id === button.dataset.id
    );

    if (!item) {
      alert('找不到這筆月收資料');
      return;
    }

    const student = studentsData.find(
      student => student.id === item.studentId
    );

    const studentName = student
      ? student.name
      : '這位學生';

    const confirmed = confirm(
      `確定要刪除「${studentName}｜${item.month}｜${item.content}」嗎？`
    );

    if (!confirmed) {
      return;
    }

    try {

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'deleteMonthlyFee',
          id: item.id
        })
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(
          result.error || '刪除失敗'
        );
      }

      alert('月收刪除成功！');

      editingMonthlyId = '';

      document.getElementById('monthlyForm').style.display = 'none';

      await loadData();

    } catch (error) {

      alert(
        '刪除月收失敗：' + error.message
      );

    }

  });
    
document
  .getElementById('monthlyStudent')
  .addEventListener('change', function () {

    const studentId = this.value;

    const student = studentsData.find(
      student => student.id === studentId
    );

    selectedStudentGrade = student
      ? student.grade
      : '';

    const settings = feeSettingsData.filter(
      setting =>
        setting.studentId === studentId &&
        setting.status === '🟢 啟用'
    );

    const contentInput =
      document.getElementById('monthlyContent');

    if (settings.length === 0) {
      contentInput.value = '';
      return;
    }

    const year =
      document.getElementById('monthlyYear').value;

    const monthValue =
      document.getElementById('monthlyMonth').value;

    const month =
      Number(
        String(monthValue).replace('月', '')
      );

    contentInput.value = settings
      .map(setting => {

        // 月繳：依實際上課堂數計算
        if (
          setting.paymentType === '月繳' &&
          year &&
          month
        ) {

          const classCount =
            countMonthlyClasses(
              year,
              month,
              setting.classDays || []
            );

          const total =
            classCount * (setting.amount || 0);

          return `${setting.course}${classCount}堂×${setting.amount}＝${total}`;
        }

        // 季繳／學期繳：目前先維持原本金額
        return `${setting.course}${setting.amount ?? ''}`;

      })
      .join('＋');

  });

  .getElementById('monthlyYear')
  .addEventListener('change', function () {

    document
      .getElementById('monthlyStudent')
      .dispatchEvent(new Event('change'));

  });

    document
  .getElementById('monthlyMonth')
  .addEventListener('change', function () {

    document
      .getElementById('monthlyStudent')
      .dispatchEvent(new Event('change'));

  });
    
    
    loadData();

  </script>
