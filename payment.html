  <script>

  const API_URL =
'https://script.google.com/macros/s/AKfycbyFhc5Sj2lj_XyJTlN61RVvumxH7HH0bgc4ejYNH6FFGGKHR2npLNJwmx2yyL-SL56W/exec';
    
    const MAIN_API_URL =
  'https://script.google.com/macros/s/AKfycbzSbeATYxXHLjmKwOY0QLuBFnoaJEWpmcWL1N3Jp3CJGAJg8qCQ_ODyS92HPGyTrbi-ig/exec';

  const addPaymentBtn =
    document.getElementById('addPaymentBtn');

  const paymentForm =
    document.getElementById('paymentForm');

  const cancelPaymentBtn =
    document.getElementById('cancelPaymentBtn');

  const studentSelect =
    document.getElementById('studentSelect');

  const studentSearch =
    document.getElementById('studentSearch');


  // 儲存全部學生
  let allStudents = [];

    let monthlyFeesData = [];

    // 目前正在編輯的收款紀錄 ID
let editingPaymentId = null;


  // =========================
  // 開啟新增收款表單
  // =========================

  addPaymentBtn.addEventListener('click', function () {

  editingPaymentId = null;

  paymentForm.style.display = 'block';

  addPaymentBtn.style.display = 'none';

  savePaymentBtn.textContent = '儲存';

  loadStudents();
loadMonthlyFees();

});


  // =========================
  // 取消
  // =========================

  cancelPaymentBtn.addEventListener('click', function () {

    editingPaymentId = null;

    paymentForm.style.display = 'none';

    addPaymentBtn.style.display = 'block';

  });


  // =========================
  // 搜尋學生
  // =========================

  studentSearch.addEventListener('input', function () {

    const keyword =
      studentSearch.value.trim().toLowerCase();

    renderStudents(keyword);

  });


  // =========================
  // 顯示學生
  // =========================

  function renderStudents(keyword = '') {

    studentSelect.innerHTML = '';

    const filteredStudents =
      allStudents.filter(function (student) {

        const name =
          String(student.name || '')
            .toLowerCase();

        const grade =
          String(student.grade || '')
            .toLowerCase();

        return (
          name.includes(keyword) ||
          grade.includes(keyword)
        );

      });


    if (filteredStudents.length === 0) {

      const option =
        document.createElement('option');

      option.value = '';

      option.textContent =
        '找不到符合的學生';

      studentSelect.appendChild(option);

      return;
    }


    filteredStudents.forEach(function (student) {

      const option =
        document.createElement('option');

      option.value = student.id;

      option.textContent =
        student.name +
        (student.grade
          ? '｜' + student.grade
          : '');

      studentSelect.appendChild(option);

    });

  }


  // =========================
  // 載入學生名單
  // =========================

  async function loadStudents() {

    studentSelect.innerHTML = `
      <option value="">
        載入學生名單中……
      </option>
    `;

    try {

      const response =
        await fetch(
          API_URL + '?action=getStudents'
        );

      const result =
        await response.json();

      if (!result.success) {

        throw new Error(
          result.message || '學生名單讀取失敗'
        );

      }


      allStudents =
        result.students || [];


      // 依年級、姓名排序
      allStudents.sort(function (a, b) {

        const gradeCompare =
          String(a.grade || '')
            .localeCompare(
              String(b.grade || ''),
              'zh-Hant'
            );

        if (gradeCompare !== 0) {
          return gradeCompare;
        }

        return String(a.name || '')
          .localeCompare(
            String(b.name || ''),
            'zh-Hant'
          );

      });


      // 顯示全部學生
      renderStudents();


      console.log(
        '學生數量：' + allStudents.length
      );

    } catch (error) {

      console.error(
        '載入學生名單失敗：',
        error
      );

      studentSelect.innerHTML = `
        <option value="">
          學生名單載入失敗
        </option>
      `;

      alert(
        '學生名單載入失敗：' +
        error.message
      );

    }

  }

    // =========================
// 載入月收資料
// =========================

async function loadMonthlyFees() {

  try {

    const response =
      await fetch(
        MAIN_API_URL
      );

    const result =
      await response.json();

    if (!result.success) {

      throw new Error(
        result.error ||
        '月收資料讀取失敗'
      );

    }

    monthlyFeesData =
      result.monthlyFees || [];

    console.log(
      '月收資料數量：' +
      monthlyFeesData.length
    );

  } catch (error) {

    console.error(
      '載入月收資料失敗：',
      error
    );

    monthlyFeesData = [];

  }

}

    // =========================
// 顯示目前學生的月收
// =========================

function renderMonthlyFeeOptions(studentId) {

  const monthlyFeeSelect =
    document.getElementById(
      'monthlyFeeSelect'
    );

  if (!monthlyFeeSelect) {
    return;
  }

  monthlyFeeSelect.innerHTML = `
    <option value="">
      不指定月收
    </option>
  `;

  if (!studentId) {
    return;
  }

  const studentFees =
    monthlyFeesData.filter(function (fee) {

      return String(fee.studentId) ===
        String(studentId);

    });

  if (studentFees.length === 0) {

    monthlyFeeSelect.innerHTML = `
      <option value="">
        此學生目前沒有月收資料
      </option>
    `;

    return;
  }

  studentFees.forEach(function (fee) {

    const option =
      document.createElement('option');

    option.value =
      fee.id;

    option.textContent =
      `${fee.year || ''}年｜${fee.month || ''}月｜${fee.content || ''}`;

    monthlyFeeSelect.appendChild(
      option
    );

  });

}

    studentSelect.addEventListener(
  'change',
  function () {

    const studentId =
      this.value;

    renderMonthlyFeeOptions(
      studentId
    );

  }
);
    
      // =========================
  // 儲存收款紀錄
  // =========================

  const savePaymentBtn =
    document.getElementById('savePaymentBtn');


  savePaymentBtn.addEventListener('click', async function () {

    const selectedOption =
      studentSelect.options[
        studentSelect.selectedIndex
      ];


    const studentId =
      studentSelect.value;

    const studentText =
      selectedOption
        ? selectedOption.textContent
        : '';


    const studentName =
      studentText.split('｜')[0];


    const paymentDate =
      document.getElementById('paymentDate').value;

    const paymentAmount =
      document.getElementById('paymentAmount').value;

    const paymentLastFive =
      document.getElementById('paymentLastFive').value.trim();

    const paymentReceipt =
      document.getElementById('paymentReceipt').checked;

    const paymentNote =
      document.getElementById('paymentNote').value.trim();

    const monthlyFeeId =
  document.getElementById('monthlyFeeSelect').value;
    

    // =========================
    // 檢查資料
    // =========================

    if (!studentId) {

      alert('請選擇學生');

      return;

    }


    if (!paymentDate) {

      alert('請選擇收款日期');

      return;

    }


    if (
      paymentAmount === '' ||
      Number(paymentAmount) < 0
    ) {

      alert('請輸入收款金額');

      return;

    }


    // =========================
    // 暫時停用按鈕
    // =========================

    savePaymentBtn.disabled = true;

    savePaymentBtn.textContent =
      '儲存中……';


    try {

      const response =
        await fetch(API_URL, {

          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body: JSON.stringify({

            action:
  editingPaymentId
    ? 'updatePaymentRecord'
    : 'createPaymentRecord',

id:
  editingPaymentId,

studentId:
  studentId,

studentName:
  studentName,

monthlyFeeId:
  monthlyFeeId,

paymentDate:
  paymentDate,

paymentAmount:
  paymentAmount,

paymentLastFive:
  paymentLastFive,

paymentReceipt:
  paymentReceipt,

paymentNote:
  paymentNote,

monthlyFeeId:
  monthlyFeeId

          })

        });


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.message ||
          '新增收款紀錄失敗'
        );

      }


      alert('💰 收款紀錄新增成功！');

      loadPaymentRecords();

      editingPaymentId = null;

savePaymentBtn.textContent = '儲存';

      // =========================
      // 清空表單
      // =========================

      studentSearch.value = '';

      studentSelect.value = '';

      document.getElementById(
        'paymentDate'
      ).value = '';

      document.getElementById(
        'paymentAmount'
      ).value = '';

      document.getElementById(
        'paymentLastFive'
      ).value = '';

      document.getElementById(
        'paymentReceipt'
      ).checked = false;

      document.getElementById(
        'paymentNote'
      ).value = '';


      renderStudents();


      paymentForm.style.display =
        'none';

      addPaymentBtn.style.display =
        'block';


    } catch (error) {

      console.error(
        '新增收款失敗：',
        error
      );

      alert(
        '新增收款失敗：' +
        error.message
      );


    } finally {

      savePaymentBtn.disabled =
        false;

      savePaymentBtn.textContent =
        '儲存';

    }

  });

    // =========================
// 載入收款紀錄
// =========================

    // =========================
// 開始編輯收款紀錄
// =========================

async function startEditPayment(data) {

  editingPaymentId = data.id;

  // 顯示表單
  paymentForm.style.display = 'block';

  // 隱藏新增按鈕
  addPaymentBtn.style.display = 'none';

  // 載入學生
  await loadStudents();

  // 帶入學生
  studentSearch.value = data.student || '';

  let foundStudent = null;

  Array.from(studentSelect.options).forEach(function (option) {

    const name =
      option.textContent
        .split('｜')[0]
        .trim();

    if (name === data.student) {
      foundStudent = option;
    }

  });

  if (foundStudent) {
    studentSelect.value =
      foundStudent.value;
  }

    // 載入並帶入對應月收
  await loadMonthlyFees();

  const monthlyFeeSelect =
    document.getElementById('monthlyFeeSelect');

  if (monthlyFeeSelect && data.monthlyFeeId) {
    monthlyFeeSelect.value =
      data.monthlyFeeId;
  }
  
  // 帶入收款日期
  document.getElementById(
    'paymentDate'
  ).value =
    data.paymentDate || '';

  // 帶入收款金額
  document.getElementById(
    'paymentAmount'
  ).value =
    data.amount ?? '';

  // 帶入匯款後五碼
  document.getElementById(
    'paymentLastFive'
  ).value =
    data.lastFive || '';

  // 帶入是否開收據
  document.getElementById(
    'paymentReceipt'
  ).checked =
    Boolean(data.receipt);

  // 帶入備註
  document.getElementById(
    'paymentNote'
  ).value =
    data.note || '';

  // 儲存按鈕改成「更新」
  savePaymentBtn.textContent =
    '更新';

}
    
async function loadPaymentRecords() {

  const paymentList =
    document.getElementById('paymentList');

  paymentList.innerHTML = `
    <div class="payment-item-empty">
      載入收款紀錄中……
    </div>
  `;

  try {

    const response =
      await fetch(
        API_URL + '?action=getPaymentRecords'
      );

    const responseText =
  await response.text();

console.log(
  '📥 收款紀錄 API 回應：',
  responseText
);

const result =
  JSON.parse(responseText);

    if (!result.success) {

      throw new Error(
        result.message ||
        '收款紀錄讀取失敗'
      );

    }

    const records =
      result.data?.results || [];

    if (records.length === 0) {

      paymentList.innerHTML = `
        <div class="payment-item-empty">
          目前沒有收款紀錄
        </div>
      `;

      return;
    }

    paymentList.innerHTML = '';

    const searchKeyword =
  document.getElementById('paymentSearch')
    .value
    .trim()
    .toLowerCase();

    const monthFilter =
  document.getElementById('paymentMonthFilter').value;

const receiptFilter =
  document.getElementById('paymentReceiptFilter').value;
    
    let displayedCount = 0;
    
    records.forEach(function (page) {

      const properties =
        page.properties || {};

      const student =
        properties['👤 學生']
          ?.title?.[0]
          ?.plain_text || '';

      if (
  searchKeyword &&
  !student.toLowerCase().includes(searchKeyword)
) {
  return;
}

      displayedCount++;
      
      const paymentDate =
        properties['📅 收款日期']
          ?.date?.start || '';

      const paymentMonth =
  paymentDate
    ? String(
        Number(
          paymentDate.split('-')[1]
        )
      )
    : '';

      if (
  monthFilter &&
  paymentMonth !== monthFilter
) {
  return;
}
      
      const amount =
        properties['💰 收款金額']
          ?.number;

      const lastFive =
        properties['💳 匯款後五碼']
          ?.rich_text?.[0]
          ?.plain_text || '';

      const receipt =
        properties['🧾 是否開收據']
          ?.checkbox || false;

      if (
  receiptFilter === 'yes' &&
  !receipt
) {
  return;
}

if (
  receiptFilter === 'no' &&
  receipt
) {
  return;
}

      const note =
  properties['📝 備註']
    ?.rich_text?.[0]
    ?.plain_text || '';

// 🔗 對應月收
const monthlyFeeId =
  properties['🔗 對應月收']
    ?.relation?.[0]
    ?.id || '';

// 🔗 對應季收
const seasonFeeId =
  properties['🔗 對應季收']
    ?.relation?.[0]
    ?.id || '';

const recordId = page.id;
      
      const item =
        document.createElement('div');

      item.className =
        'payment-item';

      item.innerHTML = `

        <div class="payment-item-name">
          👤 ${student}
        </div>

        <div class="payment-item-row">
          📅 收款日期：
          ${paymentDate || '—'}
        </div>

        <div class="payment-item-row">
          💰 收款金額：
          ${amount !== null && amount !== undefined
            ? '$' + amount
            : '—'}
        </div>

        <div class="payment-item-row">
          💳 匯款後五碼：
          ${lastFive || '—'}
        </div>

        <div class="payment-item-row">
          🧾 收據：
          ${receipt ? '已開' : '未開'}
        </div>

        ${
          note
            ? `
              <div class="payment-item-row">
                📝 備註：${note}
              </div>
            `
            : ''
        }

            `;

      const editButton =
        document.createElement('button');

      editButton.type = 'button';
      editButton.textContent = '✏️ 編輯';
      editButton.className = 'edit-payment-btn';

      editButton.addEventListener(
        'click',
        function () {

          startEditPayment({
  id: recordId,
  student: student,
  paymentDate: paymentDate,
  amount: amount,
  lastFive: lastFive,
  receipt: receipt,
  note: note,
  monthlyFeeId: monthlyFeeId,
  seasonFeeId: seasonFeeId
});

        }
      );

            // =========================
      // 刪除按鈕
      // =========================

      const deleteButton =
        document.createElement('button');

      deleteButton.type = 'button';
      deleteButton.textContent = '🗑️ 刪除';
      deleteButton.className = 'delete-payment-btn';

      deleteButton.addEventListener(
        'click',
        async function () {

          const confirmed =
            confirm(
              `確定要刪除「${student}」這筆收款紀錄嗎？`
            );

          if (!confirmed) {
            return;
          }

          try {

            if (deleteButton.dataset.deleting === 'true') {
  return;
}

deleteButton.dataset.deleting = 'true';
deleteButton.disabled = true;
deleteButton.textContent = '刪除中……';
            
            const response =
              await fetch(API_URL, {

                method: 'POST',

                headers: {
                  'Content-Type':
                    'text/plain;charset=utf-8'
                },

                body: JSON.stringify({

                  action:
                    'deletePaymentRecord',

                  id:
                    recordId

                })

              });

            const result =
              await response.json();

            if (!result.success) {

              throw new Error(
                result.message ||
                '刪除收款紀錄失敗'
              );

            }

            alert('🗑️ 收款紀錄刪除成功！');

            loadPaymentRecords();

          } catch (error) {

            console.error(
              '刪除收款紀錄失敗：',
              error
            );

            alert(
              '刪除失敗：' +
              error.message
            );

            deleteButton.dataset.deleting = 'false';
deleteButton.disabled = false;
deleteButton.textContent = '🗑️ 刪除';

          }

        }
      );

      item.appendChild(editButton);
      item.appendChild(deleteButton);

      paymentList.appendChild(item);

  });


  if (
    searchKeyword &&
    displayedCount === 0
  ) {

    paymentList.innerHTML = `
      <div class="payment-item-empty">
        🔍 找不到符合的收款紀錄
      </div>
    `;

  }


} catch (error) {

    console.error(
      '載入收款紀錄失敗：',
      error
    );

    paymentList.innerHTML = `
      <div class="payment-item-empty">
        收款紀錄載入失敗：
        ${error.message}
      </div>
    `;

  }

}

    const paymentSearch =
  document.getElementById('paymentSearch');


paymentSearch.addEventListener(
  'input',
  function () {
    loadPaymentRecords();
  }
);


    document
      .getElementById('paymentSearch')
      .addEventListener('input', function () {
        loadPaymentRecords();
      });


    document
      .getElementById('paymentMonthFilter')
      .addEventListener('change', function () {
        loadPaymentRecords();
      });


    document
      .getElementById('paymentReceiptFilter')
      .addEventListener('change', function () {
        loadPaymentRecords();
      });


    loadPaymentRecords();
    
</script>
  
</body>
