<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>💰 收款紀錄</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 8px;
      color: #777;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>💰 收款紀錄</h1>

      <div class="subtitle">
        管理學生實際收款紀錄
      </div>

    </div>


    <div class="card">

      <div class="empty">
        目前沒有收款紀錄
      </div>

    </div>

  </div>

</body>

</html>
