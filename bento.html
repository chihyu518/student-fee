<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🍱 便當管理</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f9fc;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 12px;
      background: #7aa7d9;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .save-btn:hover {
      opacity: 0.9;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="header">

      <h1>🍱 便當管理</h1>

      <div class="subtitle">
        記錄學生便當費用
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        ➕ 新增便當
      </div>


      <div class="form-group">

        <label for="studentSelect">
          👤 學生
        </label>

        <select id="studentSelect">

          <option value="">
            請選擇學生
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="bentoDate">
          📅 日期
        </label>

        <input
          id="bentoDate"
          type="date"
        >

      </div>


      <div class="form-group">

        <label for="bentoAmount">
          💰 便當費
        </label>

        <input
          id="bentoAmount"
          type="number"
          min="0"
          placeholder="請輸入便當費"
        >

      </div>


      <div class="form-group">

        <label for="bentoNote">
          📝 備註
        </label>

        <textarea
          id="bentoNote"
          placeholder="選填"
        ></textarea>

      </div>


      <button
        id="saveBentoBtn"
        class="save-btn"
      >
        儲存便當
      </button>

    </div>

  </div>


</body>

</html>
