<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>學生收費管理系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin-top: 20px;
      padding: 18px;
      background: #f2f7f3;
      border-radius: 14px;
      font-size: 18px;
    }

    .error {
      background: #fff1f1;
      color: #b42318;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💰 學生收費管理系統</h1>

    <div id="status" class="status">
      ⏳ 正在讀取學生資料...
    </div>

  </div>

  <script>

    // 把剛剛複製的 GAS /exec 網址貼在這裡
    const API_URL = 'https://script.google.com/macros/s/AKfycbzSbeATYxXHLjmKwOY0QLuBFnoaJEWpmcWL1N3Jp3CJGAJg8qCQ_ODyS92HPGyTrbi-ig/exec';

    async function loadData() {

      const status = document.getElementById('status');

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('API 連線失敗');
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || '資料讀取失敗');
        }

        status.innerHTML =
          '✅ 連線成功！目前共有 <strong>' +
          data.students.length +
          '</strong> 位學生';

      } catch (error) {

        console.error(error);

        status.classList.add('error');

        status.innerHTML =
          '❌ 資料讀取失敗';

      }
    }

    loadData();

  </script>

</body>
</html>
