<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🍱 便當管理</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f9fc;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      color: #333;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 12px;
      background: #7aa7d9;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .save-btn:hover {
      opacity: 0.9;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="header">

      <h1>🍱 便當管理</h1>

      <div class="subtitle">
        記錄學生便當費用
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        ➕ 新增便當
      </div>


      <div class="form-group">

        <label for="studentSelect">
          👤 學生
        </label>

        <select id="studentSelect">

          <option value="">
            請選擇學生
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="bentoDate">
          📅 日期
        </label>

        <input
          id="bentoDate"
          type="date"
        >

      </div>


      <div class="form-group">

        <label for="bentoAmount">
          💰 便當費
        </label>

        <input
          id="bentoAmount"
          type="number"
          min="0"
          placeholder="請輸入便當費"
        >

      </div>


      <div class="form-group">

        <label for="bentoNote">
          📝 備註
        </label>

        <textarea
          id="bentoNote"
          placeholder="選填"
        ></textarea>

      </div>


      <button
        id="saveBentoBtn"
        class="save-btn"
      >
        儲存便當
      </button>

    </div>

  </div>

  <script>

const API_URL =
'https://script.google.com/macros/s/AKfycbyFhc5Sj2lj_XyJTlN61RVvumxH7HH0bgc4ejYNH6FFGGKHR2npLNJwmx2yyL-SL56W/exec';

let allStudents = [];


const studentSelect =
  document.getElementById(
    'studentSelect'
  );


async function loadStudents() {

  studentSelect.innerHTML = `
    <option value="">
      載入學生名單中……
    </option>
  `;

  try {

    const response =
      await fetch(
        API_URL + '?action=getStudents'
      );

    const result =
      await response.json();

    if (!result.success) {

      throw new Error(
        result.message ||
        '學生名單讀取失敗'
      );

    }

    allStudents =
      result.students || [];


    allStudents.sort(
      function (a, b) {

        const gradeCompare =
          String(a.grade || '')
            .localeCompare(
              String(b.grade || ''),
              'zh-Hant'
            );

        if (gradeCompare !== 0) {
          return gradeCompare;
        }

        return String(a.name || '')
          .localeCompare(
            String(b.name || ''),
            'zh-Hant'
          );

      }
    );


    studentSelect.innerHTML = `
      <option value="">
        請選擇學生
      </option>
    `;


    allStudents.forEach(
      function (student) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          student.id;

        option.textContent =
          `${student.name || ''}｜${student.grade || ''}`;

        studentSelect.appendChild(
          option
        );

      }
    );


    console.log(
      '便當頁學生數量：' +
      allStudents.length
    );


  } catch (error) {

    console.error(
      '載入學生名單失敗：',
      error
    );

    studentSelect.innerHTML = `
      <option value="">
        學生名單載入失敗
      </option>
    `;

    alert(
      '學生名單載入失敗：' +
      error.message
    );

  }

}


// 頁面開啟時載入學生
loadStudents();

    document
  .getElementById('saveBentoBtn')
  .addEventListener(
    'click',
    async function () {

      const studentId =
        document.getElementById(
          'studentSelect'
        ).value;

      const date =
        document.getElementById(
          'bentoDate'
        ).value;

      const amount =
        document.getElementById(
          'bentoAmount'
        ).value;

      const note =
        document.getElementById(
          'bentoNote'
        ).value.trim();


      // =========================
      // 基本檢查
      // =========================

      if (!studentId) {

        alert('請選擇學生');
        return;

      }

      if (!date) {

        alert('請選擇日期');
        return;

      }

      if (
        amount === '' ||
        amount === null
      ) {

        alert('請輸入便當費');
        return;

      }


      const saveBtn =
        document.getElementById(
          'saveBentoBtn'
        );


      saveBtn.disabled = true;
      saveBtn.textContent =
        '儲存中……';


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body: JSON.stringify({

                action:
                  'createBento',

                studentId:
                  studentId,

                date:
                  date,

                amount:
                  Number(amount),

                note:
                  note

              })

            }
          );


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error ||
            '便當儲存失敗'
          );

        }


        alert(
          '🍱 便當紀錄新增成功！'
        );


        // 清空表單
        document.getElementById(
          'studentSelect'
        ).value = '';

        document.getElementById(
          'bentoDate'
        ).value = '';

        document.getElementById(
          'bentoAmount'
        ).value = '';

        document.getElementById(
          'bentoNote'
        ).value = '';


      } catch (error) {

        console.error(
          '新增便當失敗：',
          error
        );

        alert(
          '便當儲存失敗：' +
          error.message
        );

      } finally {

        saveBtn.disabled = false;

        saveBtn.textContent =
          '儲存便當';

      }

    }
  );
    
</script>

</body>

</html>
