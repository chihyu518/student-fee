<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>學生收費管理系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f7f9;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      color: #2f3437;
    }

    .header {
      background: white;
      border-bottom: 1px solid #ececec;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      color: #888;
      font-size: 14px;
    }

    .nav {
  background: white;
  border-bottom: 1px solid #ececec;
}

.nav-inner {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.nav-btn {
  border: none;
  background: transparent;
  padding: 16px 18px;
  font-size: 15px;
  color: #777;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  font-family: inherit;
}

.nav-btn:hover {
  color: #333;
  background: #fafafa;
}

.nav-btn.active {
  color: #222;
  font-weight: 600;
  border-bottom-color: #222;
}

    .monthly-form {
  background: #f8f9fa;
  border: 1px solid #eeeeee;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}

.monthly-form h3 {
  margin-top: 0;
  margin-bottom: 18px;
  font-size: 18px;
}

.monthly-form label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
  color: #444;
}

.monthly-form select,
.monthly-form input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #dddddd;
  border-radius: 10px;
  background: white;
  font-size: 14px;
  font-family: inherit;
  outline: none;
}

.monthly-form select:focus,
.monthly-form input[type="text"]:focus {
  border-color: #999;
}

.monthly-form input[type="checkbox"] {
  margin-right: 6px;
}

#saveMonthlyBtn,
#cancelMonthlyBtn {
  margin-top: 18px;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

#saveMonthlyBtn {
  border: none;
  background: #222;
  color: white;
  font-weight: 600;
}

#cancelMonthlyBtn {
  border: 1px solid #dddddd;
  background: white;
  color: #555;
  margin-left: 6px;
}

#saveMonthlyBtn:hover,
#cancelMonthlyBtn:hover {
  opacity: 0.85;
}
    
    .monthly-actions {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 14px;
}

.add-monthly-btn {
  border: none;
  background: #222;
  color: white;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
}

.add-monthly-btn:hover {
  opacity: 0.85;
}

@media (max-width: 600px) {
  .add-monthly-btn {
    width: 100%;
  }
}
    
    .monthly-filters {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.monthly-filters select {
  padding: 10px 14px;
  border: 1px solid #dddddd;
  border-radius: 10px;
  background: white;
  font-size: 14px;
  color: #444;
  font-family: inherit;
  cursor: pointer;
  outline: none;
}

.monthly-filters select:focus {
  border-color: #999;
}

@media (max-width: 600px) {
  .monthly-filters select {
    flex: 1;
    min-width: 130px;
  }
}
    
    .monthly-item {
  background: #f8f9fa;
  border: 1px solid #eeeeee;
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 12px;
}

.monthly-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.monthly-name {
  font-size: 17px;
  font-weight: 600;
  color: #222;
}

.monthly-tag {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 13px;
  color: #666;
}

.monthly-content {
  font-size: 15px;
  color: #444;
  margin-bottom: 8px;
}

.monthly-status {
  font-size: 14px;
  color: #555;
}

    .edit-monthly-btn {
  margin-top: 12px;
  padding: 8px 14px;
  border: 1px solid #dddddd;
  border-radius: 9px;
  background: white;
  color: #444;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}

.edit-monthly-btn:hover {
  background: #f3f3f3;
}
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px 20px 50px;
    }

    .loading {
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .error {
      color: #b42318;
      background: #fff1f1;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .card-icon {
      font-size: 25px;
      margin-bottom: 14px;
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .card-number {
      font-size: 30px;
      font-weight: 700;
    }

    .card-unit {
      font-size: 14px;
      color: #999;
      margin-left: 3px;
    }

    .section {
      margin-top: 25px;
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .section h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    .status {
      padding: 14px 16px;
      background: #f7f8fa;
      border-radius: 12px;
      line-height: 1.7;
    }

    @media (max-width: 750px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .header h1 {
        font-size: 22px;
      }

      .card {
        padding: 18px;
      }

      .card-number {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <h1>💰 學生收費管理系統</h1>
      <p>學生・月收・季收・收費設定</p>
    </div>
  </header>

  <nav class="nav">
  <div class="nav-inner">

  <button class="nav-btn active" onclick="showPage('dashboard', this)">
  🏠 總覽
</button>

<button class="nav-btn" onclick="showPage('monthlyPage', this)">
  💰 月收
</button>

    <button class="nav-btn">
      📚 季收
    </button>

    <button class="nav-btn">
      ⚙️ 收費設定
    </button>

  </div>
</nav>
  
  <main class="container">

    <div id="loading" class="loading">
      ⏳ 正在讀取資料...
    </div>

    <div id="dashboard" class="page" style="display:none;">

      <div class="cards">

        <div class="card">
          <div class="card-icon">🧑‍🎓</div>
          <div class="card-title">學生總數</div>
          <span id="studentCount" class="card-number">0</span>
          <span class="card-unit">位</span>
        </div>

        <div class="card">
          <div class="card-icon">💰</div>
          <div class="card-title">月收資料</div>
          <span id="monthlyCount" class="card-number">0</span>
          <span class="card-unit">筆</span>
        </div>

        <div class="card">
          <div class="card-icon">📚</div>
          <div class="card-title">季收資料</div>
          <span id="seasonCount" class="card-number">0</span>
          <span class="card-unit">筆</span>
        </div>

        <div class="card">
          <div class="card-icon">⚙️</div>
          <div class="card-title">收費設定</div>
          <span id="settingCount" class="card-number">0</span>
          <span class="card-unit">筆</span>
        </div>

      </div>

      <div class="section">
        <h2>📊 系統狀態</h2>

        <div class="status">
          🟢 Notion 資料連線正常<br>
          🟢 學生名單已同步<br>
          🟢 月收、季收與收費設定已連接
        </div>
      </div>

    </div>

    <div id="monthlyPage" class="page" style="display:none;">

  <div class="section">
    <h2>💰 月收管理</h2>

    <div class="monthly-actions">
  <button class="add-monthly-btn" id="addMonthlyBtn">
    ＋ 新增月收
  </button>
</div>
    
    <div class="monthly-filters">

  <select id="monthFilter">
    <option value="">全部月份</option>
    <option value="1月">1月</option>
    <option value="2月">2月</option>
    <option value="3月">3月</option>
    <option value="4月">4月</option>
    <option value="5月">5月</option>
    <option value="6月">6月</option>
    <option value="7月">7月</option>
    <option value="8月">8月</option>
    <option value="9月">9月</option>
    <option value="10月">10月</option>
    <option value="11月">11月</option>
    <option value="12月">12月</option>
  </select>

  <select id="gradeFilter">
    <option value="">全部年級</option>
    <option value="一年級">一年級</option>
    <option value="二年級">二年級</option>
    <option value="三年級">三年級</option>
    <option value="四年級">四年級</option>
    <option value="五年級">五年級</option>
    <option value="六年級">六年級</option>
    <option value="國一">國一</option>
    <option value="國二">國二</option>
    <option value="國三">國三</option>
  </select>

</div>

    <div id="monthlyForm" class="monthly-form" style="display:none;">
      
 <h3>➕ 新增月收</h3>

  <label for="monthlyStudent">學生</label>
  <select id="monthlyStudent">
    <option value="">請選擇學生</option>
  </select>

  <label for="monthlyMonth">收費月份</label>
  <select id="monthlyMonth">
    <option value="">請選擇月份</option>
    <option value="1月">1月</option>
    <option value="2月">2月</option>
    <option value="3月">3月</option>
    <option value="4月">4月</option>
    <option value="5月">5月</option>
    <option value="6月">6月</option>
    <option value="7月">7月</option>
    <option value="8月">8月</option>
    <option value="9月">9月</option>
    <option value="10月">10月</option>
    <option value="11月">11月</option>
    <option value="12月">12月</option>
  </select>

  <label for="monthlyContent">收費內容</label>
  <input
    type="text"
    id="monthlyContent"
    placeholder="例如：課輔6000"
  >

  <label>
    <input type="checkbox" id="monthlyBilled">
    已開單
  </label>

  <div>
    <button type="button" id="saveMonthlyBtn">
      儲存
    </button>

    <button type="button" id="cancelMonthlyBtn">
      取消
    </button>
  </div>

</div>
    
<div id="monthlyList">
  月收資料載入中...
</div>
  </div>

</div>
    
  </main>

  <script>

    // ⚠️ 把你剛才複製的 GAS /exec 網址貼在這裡
    const API_URL = 'https://script.google.com/macros/s/AKfycbzSbeATYxXHLjmKwOY0QLuBFnoaJEWpmcWL1N3Jp3CJGAJg8qCQ_ODyS92HPGyTrbi-ig/exec';

    let monthlyFeesData = [];
    let studentsData = [];
    let selectedStudentGrade = '';
    let editingMonthlyId = '';
    
    async function loadData() {

      const loading = document.getElementById('loading');
      const dashboard = document.getElementById('dashboard');

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('API 連線失敗');
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || '資料讀取失敗');
        }

        monthlyFeesData = data.monthlyFees;
        studentsData = data.students;

        renderStudentOptions();
        
        document.getElementById('studentCount').textContent =
          data.students.length;

        document.getElementById('monthlyCount').textContent =
          data.monthlyFees.length;

renderMonthlyFees(monthlyFeesData);

        document.getElementById('seasonCount').textContent =
          data.seasonFees.length;

        document.getElementById('settingCount').textContent =
          data.feeSettings.length;

        loading.style.display = 'none';
        dashboard.style.display = 'block';

      } catch (error) {

        console.error(error);

        loading.classList.add('error');
        loading.innerHTML = '❌ 資料讀取失敗';

      }
    }

    function renderStudentOptions() {

  const studentSelect =
    document.getElementById('monthlyStudent');

  studentSelect.innerHTML =
    '<option value="">請選擇學生</option>';

  studentsData.forEach(student => {

    const option = document.createElement('option');

    option.value = student.id;
    option.textContent =
      `${student.name}｜${student.grade || '未設定年級'}`;

    studentSelect.appendChild(option);

  });
}
    
    function renderMonthlyFees(monthlyFees) {

  const monthlyList = document.getElementById('monthlyList');

  if (monthlyFees.length === 0) {
    monthlyList.innerHTML = '目前沒有符合條件的月收資料';
    return;
  }

  monthlyList.innerHTML = monthlyFees.map(item => {

    const student = studentsData.find(
      student => student.id === item.studentId
    );

    const studentName = student
      ? student.name
      : '未知學生';

    return `
      <div class="monthly-item">

        <div class="monthly-top">
          <span class="monthly-name">${studentName}</span>

          <span class="monthly-tag">
            ${item.grade || '未設定年級'}
          </span>

          <span class="monthly-tag">
            ${item.month || '未設定月份'}
          </span>
        </div>

        <div class="monthly-content">
          💰 ${item.content || '未設定收費內容'}
        </div>

        <div class="monthly-status">
          ${item.billed ? '✅ 已開單' : '⬜ 未開單'}
        </div>

<button
  type="button"
  class="edit-monthly-btn"
  data-id="${item.id}">
  ✏️ 編輯
</button>

      </div>
    `;

  }).join('');
}

    function filterMonthlyFees() {

  const selectedMonth =
    document.getElementById('monthFilter').value;

  const selectedGrade =
    document.getElementById('gradeFilter').value;

  const filteredFees = monthlyFeesData.filter(item => {

    const matchMonth =
      !selectedMonth || item.month === selectedMonth;

    const matchGrade =
      !selectedGrade || item.grade === selectedGrade;

    return matchMonth && matchGrade;

  });

  renderMonthlyFees(filteredFees);
}
    
        function showPage(pageId, button) {

      document.querySelectorAll('.page').forEach(page => {
        page.style.display = 'none';
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      document.getElementById(pageId).style.display = 'block';

      button.classList.add('active');
    }

    document
  .getElementById('monthFilter')
  .addEventListener('change', filterMonthlyFees);

document
  .getElementById('gradeFilter')
  .addEventListener('change', filterMonthlyFees);

    document
  .getElementById('addMonthlyBtn')
  .addEventListener('click', function () {
    document.getElementById('monthlyForm').style.display = 'block';
  });

    document
  .getElementById('saveMonthlyBtn')
  .addEventListener('click', async function () {

    const studentId =
      document.getElementById('monthlyStudent').value;

    const month =
      document.getElementById('monthlyMonth').value;

    const content =
      document.getElementById('monthlyContent').value.trim();

    const billed =
      document.getElementById('monthlyBilled').checked;

    if (!studentId) {
      alert('請選擇學生');
      return;
    }

    if (!selectedStudentGrade) {
      alert('找不到學生年級');
      return;
    }

    if (!month) {
      alert('請選擇收費月份');
      return;
    }

    if (!content) {
      alert('請輸入收費內容');
      return;
    }

    alert('目前 editingMonthlyId：' + editingMonthlyId);
const payload = {
  action: editingMonthlyId ? 'updateMonthlyFee' : 'createMonthlyFee',
  id: editingMonthlyId,
  studentId: studentId,
  grade: selectedStudentGrade,
  month: month,
  content: content,
  billed: billed
};

    alert(
  '送出 action：' + payload.action +
  '\n送出 id：' + payload.id
);
    
    try {

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.error || '新增失敗');
      }

alert(editingMonthlyId ? '月收修改成功！' : '月收新增成功！');

// 清空表單
document.getElementById('monthlyStudent').value = '';
document.getElementById('monthlyMonth').value = '';
document.getElementById('monthlyContent').value = '';
document.getElementById('monthlyBilled').checked = false;

selectedStudentGrade = '';

// 收起新增表單
document.getElementById('monthlyForm').style.display = 'none';

// 重新讀取最新資料
await loadData();

    } catch (error) {

      console.error(error);
      alert('新增月收失敗：' + error.message);

    }

  });
    
document
  .getElementById('cancelMonthlyBtn')
  .addEventListener('click', function () {
    document.getElementById('monthlyForm').style.display = 'none';
  });

    document
  .getElementById('monthlyList')
  .addEventListener('click', function (event) {

    const button = event.target.closest('.edit-monthly-btn');

    if (!button) {
      return;
    }

    const item = monthlyFeesData.find(
      fee => fee.id === button.dataset.id
    );

    if (!item) {
      return;
    }

    editingMonthlyId = item.id;

    const studentSelect =
      document.getElementById('monthlyStudent');

    const monthSelect =
      document.getElementById('monthlyMonth');

    const contentInput =
      document.getElementById('monthlyContent');

    const billedCheckbox =
      document.getElementById('monthlyBilled');

    studentSelect.value = item.studentId;

    studentSelect.dispatchEvent(
      new Event('change')
    );

    monthSelect.value = item.month || '';

    contentInput.value = item.content || '';

    billedCheckbox.checked = item.billed === true;

    document.getElementById('monthlyForm').style.display = 'block';

    document
      .getElementById('monthlyForm')
      .scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

  });
    
    document
  .getElementById('monthlyStudent')
  .addEventListener('change', function () {

    const student = studentsData.find(
      student => student.id === this.value
    );

    selectedStudentGrade = student
      ? student.grade
      : '';

  });
    
    loadData();

  </script>
  


</body>
</html>
